name: Vercel deployment cleanup

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply eligible deletions (otherwise dry-run)
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      VERCEL_TEAM_ID: team_HSxbM1n9TThluD1tkS8MrfHF
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Inventory deployable source bytes
        run: node scripts/vercel-deploy-byte-inventory.mjs
      - name: Apply scheduled retention policy
        if: github.event_name == 'schedule' || inputs.apply
        run: node scripts/vercel-deployment-cleanup.mjs --apply
      - name: Dry-run retention policy
        if: github.event_name == 'workflow_dispatch' && !inputs.apply
        run: node scripts/vercel-deployment-cleanup.mjs
